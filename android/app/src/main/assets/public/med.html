<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071b3b">
  <title>MediZen | Medicine Schedule</title>

  <link rel="stylesheet" href="med.css">
</head>

<body>
  <main class="medicine-app">
    <header class="topbar">
      <a class="back-link" href="index.html">← MediZen</a>
      <strong>Medicine Schedule</strong>
      <button id="enableReminders" class="alarm-button" type="button">
        🔔 Enable Alarm
      </button>
    </header>

    <nav class="tabs" aria-label="Medicine navigation">
      <button class="tab active" type="button" data-screen="home">
        ⌂ Home
      </button>
      <button class="tab" type="button" data-screen="schedule">
        ✚ Edit Schedule
      </button>
    </nav>

    <section id="homeScreen" class="screen">
      <section class="welcome-card">
        <p id="todayLabel"></p>
        <h1>My Medicines</h1>
        <p>Your medicine schedule for today.</p>
        <button class="primary-button" type="button" data-screen="schedule">
          Add or edit medicine
        </button>
      </section>

      <section class="card">
        <div class="section-heading">
          <h2>Today’s Schedule</h2>
          <span id="todayCount">0 medicines</span>
        </div>
        <div id="todayList"></div>
      </section>
    </section>

    <section id="scheduleScreen" class="screen" hidden>
      <section class="card">
        <h1>Medicine Schedule</h1>
        <p class="description">
          Your schedule repeats from the selected starting date until you edit or delete it.
        </p>

        <form id="medicineForm">
          <input id="editId" type="hidden">

          <label for="medicineName">Medicine name</label>
          <input id="medicineName" type="text"
                 placeholder="Example: Paracetamol" required>

          <label for="startDate">Starting date</label>
          <input id="startDate" type="date" required>

          <label for="repeat">Schedule</label>
          <select id="repeat" required>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
          </select>

          <label for="medicineTime">Time</label>
          <input id="medicineTime" type="time" required>

          <div class="form-buttons">
            <button id="cancelEdit" class="secondary-button" type="button">
              Clear
            </button>
            <button id="saveButton" class="primary-button" type="submit">
              Save Medicine
            </button>
          </div>
        </form>

        <p id="saveStatus" class="status-message" role="status" aria-live="polite"></p>
      </section>

      <section class="card">
        <div class="section-heading">
          <h2>Saved Schedules</h2>
          <button id="testAlarm" class="text-button" type="button">
            Test Alarm
          </button>
        </div>
        <div id="savedList"></div>
      </section>
    </section>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="med.js"></script><script src="translations.js"></script>
</body>
</html>
